name: ZeniaOne Production Monitor & Keep-Alive

on:
  schedule:
    # Run every 8 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping & Warm Live Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend & Verify Health
        env:
          BACKEND_URL: https://zeniaone-backend.onrender.com
        run: |
          echo "Warming Render backend ($BACKEND_URL)..."
          # Allow up to 90s for cold start; retry on 502/503 during wake-up
          health="$(curl --retry 3 --retry-delay 5 --retry-connrefused --max-time 90 --silent --show-error "$BACKEND_URL/health" || true)"
          echo "Backend Health: $health"
          
          ready="$(curl --retry 2 --retry-delay 3 --max-time 60 --silent --show-error "$BACKEND_URL/ready" || true)"
          echo "Backend Ready: $ready"

      - name: Ping Frontend
        run: |
          echo "Warming Render frontend (https://zeniaone-web.onrender.com)..."
          curl --retry 3 --retry-delay 5 --max-time 60 --silent --show-error --location -o /dev/null https://zeniaone-web.onrender.com/ || true
          echo "Frontend pinged successfully."

