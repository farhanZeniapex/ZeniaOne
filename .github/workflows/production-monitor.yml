name: ZeniaOne Production Monitor & Keep-Alive

on:
  schedule:
    # Run every 8 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Ping & Warm Live Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend & Verify Health
        env:
          BACKEND_URL: https://zeniaone-backend.onrender.com
        run: |
          set -euo pipefail
          echo "Warming Render backend ($BACKEND_URL)..."
          # Render may need a cold-start window. Retry transient HTTP, DNS,
          # connection and timeout failures, but fail after the retry budget
          # so a real outage still produces an actionable alert.
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 45 --retry 4 --retry-all-errors \
            --retry-delay 8 --retry-max-time 150 "$BACKEND_URL/health" > health.json
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 45 --retry 4 --retry-all-errors \
            --retry-delay 8 --retry-max-time 150 "$BACKEND_URL/ready" > ready.json
          python - <<'PY'
          import json
          health = json.load(open("health.json", encoding="utf-8"))
          ready = json.load(open("ready.json", encoding="utf-8"))
          assert health.get("status") == "healthy", health
          assert health.get("service") == "ZeniaOne", health
          assert health.get("database") == "connected", health
          assert ready.get("status") == "ready", ready
          print("Backend health and readiness verified")
          PY

      - name: Ping Frontend
        env:
          FRONTEND_URL: https://zeniaone-web.onrender.com/
        run: |
          set -euo pipefail
          echo "Warming Render frontend ($FRONTEND_URL)..."
          curl --fail --silent --show-error --location -o /dev/null \
            --connect-timeout 15 --max-time 45 --retry 4 --retry-all-errors \
            --retry-delay 8 --retry-max-time 150 "$FRONTEND_URL"
          echo "Frontend pinged successfully."

