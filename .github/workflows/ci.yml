name: ZeniaOne CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: zenaipex
      APP_ENV: test
      APP_SECRET_KEY: ci-only-test-secret-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
      MONGODB_URI: mongodb://localhost:27017/zenaipex_test
      MONGODB_DB_NAME: zenaipex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r zenaipex/requirements.txt
      - run: pip install pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zenaipex-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zenaipex-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
