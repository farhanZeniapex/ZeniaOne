[project]
name = "ai-voice-call-agent"
version = "2.0.0"
description = "Production-ready AI calling agent for hospital appointment booking using Twilio, Sarvam AI, Pinecone, and MongoDB"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Syed Husnain Haider Bukhari", email = "husnain@example.com" }
]
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi==0.124.4",
    "uvicorn[standard]==0.38.0",
    # Twilio
    "twilio==9.8.8",
    # Database
    "pymongo==4.15.5",
    "motor==3.7.1", # Async MongoDB driver
    # Vector database
    "pinecone==8.0.0",
    # HTTP requests
    "requests==2.32.5",
    # Environment management
    "python-dotenv==1.2.1",
    # NLP and embeddings
    "sentence-transformers==5.2.0",
    # Async support for future streaming
    "aiohttp==3.13.2",
    "websockets==15.0.1",
    # Utilities
    "numpy==2.3.5",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-multipart==0.0.20",
    "sarvamai==0.1.22",
    "apscheduler==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "black==25.9.0",
    "ruff==0.14.1",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["zenaipex/tests"]
python_files = ["test_*.py"]
